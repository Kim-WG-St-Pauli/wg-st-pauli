name: Prüfen & Veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Daten prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/validate-series.mjs

  deploy:
    name: Veröffentlichen
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Alt-Archiv nicht mitveröffentlichen
        # v1/ ist der eingefrorene Export der alten WordPress-Seite. Er bleibt im
        # Repository erhalten, wird aber nicht ausgeliefert: Die Seiten enthalten ein
        # veraltetes Impressum, eine englische WordPress-Muster-Datenschutzerklärung
        # (Login-Cookies, Gravatar – trifft hier alles nicht zu) und laden Font Awesome
        # von cdnjs.cloudflare.com. Zum Wiederveröffentlichen diesen Schritt entfernen.
        run: rm -rf v1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
